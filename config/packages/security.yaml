security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateurs
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        partner:
            pattern: ^/dashboard/partenaire
            provider: app_user_provider
            form_login:
                login_path: app_login_controller_partner
                check_path: app_login_controller_partner
                enable_csrf: true
            logout:
                path: app_logout
            # Supprimez "anonymous: false" et configurez l'accès via access_control

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
            # Supprimez "anonymous: true" et configurez l'accès via access_control

    access_control:
        - { path: ^/dashboard/partenaire, roles: ROLE_PARTENAIRE }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }