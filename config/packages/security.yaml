security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateurs
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        partner:
            pattern: ^/(dashboard/partenaire|login/partner|api/notifications)
            provider: app_user_provider
            custom_authenticators:
                - App\Security\Authenticator\PartnerAuthenticator
            logout:
                 path: app_logout_partner
                 target: app_home
                 invalidate_session: true
            stateless: false
            lazy: true
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                # login_path: app_login
                # check_path: app_login
                login_path: app_login_controller2
                check_path: app_login_controller2
                enable_csrf: true
                default_target_path: /
            logout:
                path: app_logout
                target: app_login
            stateless: false

    access_control:
        - { path: ^/dashboard/partenaire, roles: ROLE_PARTENAIRE }
        - { path: ^/partner, roles: ROLE_PARTENAIRE }        
        - { path: ^/login/partner, roles: PUBLIC_ACCESS }
        - { path: ^/sign-up/partner, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/login2, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }
